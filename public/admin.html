<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meting Adapter Admin</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:40px auto;padding:0 18px;line-height:1.65;background:#fafafa;color:#18181b}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:18px;margin:16px 0}
input{font:inherit;padding:8px 10px;border:1px solid #d4d4d8;border-radius:8px;width:320px}
button{font:inherit;padding:8px 12px;border:1px solid #18181b;border-radius:8px;background:#18181b;color:#fff;cursor:pointer;margin:4px 6px 4px 0}
pre{background:#f4f4f5;padding:14px;border-radius:10px;overflow:auto;max-height:520px}
code{background:#f4f4f5;padding:2px 6px;border-radius:6px}
.ok{color:#15803d}.bad{color:#b91c1c}
</style>
</head>
<body>
<h1>白名单管理</h1>

<div class="card">
  <p>这个页面只做三件事：验证密码、临时关闭白名单、重新开启白名单。白名单规则仍然只从环境变量 <code>ALLOWLIST</code> 读取。</p>
  <p>
    管理员密码：
    <input id="pwd" type="password" placeholder="输入 ADMIN_PASSWORD">
  </p>
  <p>
    <button onclick="status()">读取状态</button>
    <button onclick="toggle(true)">临时关闭白名单</button>
    <button onclick="toggle(false)">重新开启白名单</button>
  </p>
  <p id="msg">等待操作。</p>
  <pre id="out">等待操作。</pre>
</div>

<div class="card">
  <h2>无 JS 兜底表单</h2>
  <p>如果上面的按钮没反应，用这里提交，浏览器会直接打开 JSON 结果。</p>
  <form action="/api" method="get" target="_blank">
    <input type="hidden" name="action" value="admin-status">
    <input name="password" type="password" placeholder="管理员密码">
    <button type="submit">读取状态 JSON</button>
  </form>
  <form action="/api" method="get" target="_blank">
    <input type="hidden" name="action" value="admin-toggle">
    <input type="hidden" name="disabled" value="true">
    <input name="password" type="password" placeholder="管理员密码">
    <button type="submit">临时关闭 JSON</button>
  </form>
  <form action="/api" method="get" target="_blank">
    <input type="hidden" name="action" value="admin-toggle">
    <input type="hidden" name="disabled" value="false">
    <input name="password" type="password" placeholder="管理员密码">
    <button type="submit">重新开启 JSON</button>
  </form>
</div>

<script>
function show(data, ok) {
  document.getElementById('msg').textContent = data.message || (ok ? '请求成功' : '请求失败');
  document.getElementById('msg').className = ok ? 'ok' : 'bad';
  document.getElementById('out').textContent = JSON.stringify(data, null, 2);
}
async function call(action, extra='') {
  const pwd = document.getElementById('pwd').value;
  if (!pwd) {
    show({ ok:false, message:'你还没有输入管理员密码。' }, false);
    return;
  }
  try {
    const res = await fetch('/api?action=' + action + extra + '&password=' + encodeURIComponent(pwd), {
      headers: { 'X-Admin-Password': pwd }
    });
    const data = await res.json();
    show(data, res.ok && data.ok);
  } catch (e) {
    show({ ok:false, message:'请求失败：' + e.message }, false);
  }
}
function status(){ call('admin-status'); }
function toggle(disabled){ call('admin-toggle', '&disabled=' + (disabled ? 'true' : 'false')); }
</script>
</body>
</html>
