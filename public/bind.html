<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号绑定教程</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:680px;margin:40px auto;padding:0 18px;line-height:1.65;background:#fafafa;color:#18181b}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:18px;margin:16px 0}
.btn{font:inherit;padding:10px 18px;border:1px solid #18181b;border-radius:8px;background:#18181b;color:#fff;cursor:pointer;font-size:15px;width:100%}
.btn:hover{background:#27272a}
.code-box{background:#f4f4f5;padding:14px;border-radius:10px;font-family:monospace;font-size:13px;word-break:break-all;user-select:all;margin:12px 0}
.step{display:flex;gap:12px;margin:12px 0}
.step-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#18181b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}
.step-text{flex:1;padding-top:3px}
.ok{color:#15803d;font-weight:bold}
.err{color:#b91c1c}
.link{color:#2563eb;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<h1 id="title">账号绑定教程</h1>
<div class="card" id="content">
  <p style="text-align:center;color:#71717a">加载中...</p>
</div>

<script>
// v2.4.1: 浏览器端提取关键字段, 生成短字符串 (避免 Minecraft 聊天栏 256 字符限制截断)
// 每个平台的 jsCode 在目标网站的控制台执行, 只提取登录所需字段
const PLATFORMS = {
  qq: {
    name: 'QQ音乐',
    site: 'https://y.qq.com/',
    color: '#d946ef',
    // QQ 只需 uin 和 qqmusic_key, 格式: uin|qqmusic_key (约100字符, 远小于256限制)
    js: "javascript:(function(){var c=document.cookie;var u=(c.match(/\\buin=o?(\\d+)/)||[])[1]||'';var k=(c.match(/qqmusic_key=([^;\\s]+)/)||[])[1]||'';if(u&&k){copy(u+'|'+k);console.log('已复制 QQ 登录信息:\\nuin='+u+'\\nqqmusic_key='+k.slice(0,20)+'...')}else{console.log('未找到 uin 或 qqmusic_key, 请确认已在 y.qq.com 登录')}})()"
  },
  kugou: {
    name: '酷狗',
    site: 'https://www.kugou.com/',
    color: '#16a34a',
    // 酷狗提取 KugooID/KugooToken 或 userid/token, 格式: KugooID=xxx; KugooToken=yyy
    js: "javascript:(function(){var c=document.cookie;var p=[];var uid=c.match(/(?:^|;\\s*)KugooID=([^;]+)/i)||c.match(/(?:^|;\\s*)userid=([^;]+)/i);var tk=c.match(/(?:^|;\\s*)KugooToken=([^;]+)/i)||c.match(/(?:^|;\\s*)token=([^;]+)/i);if(uid)p.push(uid[0].trim());if(tk)p.push(tk[0].trim());if(p.length){copy(p.join('; '));console.log('已复制酷狗登录信息:\\n'+p.join('; '))}else{console.log('未找到酷狗登录字段, 请确认已登录')}})()"
  },
  kuwo: {
    name: '酷我',
    site: 'https://www.kuwo.cn/',
    color: '#ea580c',
    // 酷我提取 kw_user_id/kw_token, 格式: kw_user_id=xxx; kw_token=yyy
    js: "javascript:(function(){var c=document.cookie;var p=[];var uid=c.match(/(?:^|;\\s*)kw_user_id=([^;]+)/i)||c.match(/(?:^|;\\s*)userid=([^;]+)/i);var tk=c.match(/(?:^|;\\s*)kw_token=([^;]+)/i);if(uid)p.push(uid[0].trim());if(tk)p.push(tk[0].trim());if(p.length){copy(p.join('; '));console.log('已复制酷我登录信息:\\n'+p.join('; '))}else{console.log('未找到酷我登录字段, 请确认已登录')}})()"
  }
};

const params = new URLSearchParams(location.search);
const platform = params.get('platform') || 'kugou';
const meta = PLATFORMS[platform] || PLATFORMS.kugou;

document.title = meta.name + ' 账号绑定教程';
document.getElementById('title').textContent = meta.name + ' 账号绑定教程';

document.getElementById('content').innerHTML = `
  <div class="step">
    <div class="step-num">1</div>
    <div class="step-text">先登录 <span class="link" onclick="window.open('${meta.site}','_blank')">${meta.site}</span></div>
  </div>
  <div class="step">
    <div class="step-num">2</div>
    <div class="step-text">在登录后的页面按 <b>F12</b>，点击 <b>Console</b> (控制台) 标签</div>
  </div>
  <div class="step">
    <div class="step-num">3</div>
    <div class="step-text">点击下面按钮复制代码，粘贴到控制台，按回车</div>
  </div>
  <div class="code-box" id="code">${escapeHtml(meta.js)}</div>
  <button class="btn" id="copyBtn" onclick="copyCode()">📋 一键复制代码</button>
  <div id="result" style="margin-top:12px"></div>
  <div class="card" style="background:#fff7ed;border-color:#fed7aa;margin-top:16px">
    <p style="margin:0;font-size:14px;color:#9a3412"><b>⚠️ 遇到 "禁止粘贴" / "Allow pasting" 提醒？</b></p>
    <p style="margin:8px 0 0;font-size:13px;color:#9a3412">浏览器会阻止在控制台粘贴代码 (防止钓鱼)。如果粘贴时弹出警告：</p>
    <p style="margin:8px 0 0;font-size:13px;color:#9a3412">① 不要关闭警告，直接在控制台输入 <code style="background:#fee2e2;padding:2px 6px;border-radius:4px;font-weight:bold">允许粘贴</code> 后回车</p>
    <p style="margin:6px 0 0;font-size:13px;color:#9a3412">② Chrome 用户输入 <code style="background:#fee2e2;padding:2px 6px;border-radius:4px;font-weight:bold">allow pasting</code> 后回车</p>
    <p style="margin:6px 0 0;font-size:13px;color:#9a3412">③ 然后再次粘贴我们的代码，按回车即可</p>
  </div>
  <hr style="margin:20px 0;border:none;border-top:1px solid #e4e4e7">
  <p style="font-size:14px;color:#71717a">控制台显示 <b style="color:#15803d">已复制</b> 后，回到游戏按 <b>Ctrl+V</b> 粘贴到聊天栏，回车即可完成绑定。</p>
  <p style="font-size:13px;color:#71717a">说明: 代码会自动提取登录关键字段 (非完整 cookie)，字符串很短，可以直接粘贴到游戏聊天栏。</p>
`;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function copyCode() {
  const btn = document.getElementById('copyBtn');
  const result = document.getElementById('result');
  try {
    await navigator.clipboard.writeText(meta.js);
    btn.textContent = '✅ 已复制！';
    btn.style.background = '#15803d';
    result.innerHTML = '<p class="ok">代码已复制到剪贴板！现在去浏览器控制台粘贴并回车。</p>';
  } catch(e) {
    const codeEl = document.getElementById('code');
    const range = document.createRange();
    range.selectNode(codeEl);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    btn.textContent = '✅ 已复制！';
    result.innerHTML = '<p class="ok">代码已复制！现在去浏览器控制台粘贴并回车。</p>';
  }
  setTimeout(() => {
    btn.textContent = '📋 一键复制代码';
    btn.style.background = '#18181b';
  }, 3000);
}
</script>
</body>
</html>
