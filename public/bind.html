<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号绑定 — 扫码登录</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#18181b;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.wrap{max-width:480px;width:100%}
h1{text-align:center;font-size:22px;margin:16px 0 8px}
.sub{text-align:center;color:#71717a;font-size:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;border:2px solid #e4e4e7;border-radius:10px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;background:#fff}
.tab.active{border-color:var(--c);color:var(--c);background:var(--bg)}
.tab:hover:not(.active){border-color:#a1a1aa}
#qr-area{text-align:center;padding:10px 0}
#qr-box{display:inline-block;padding:16px;background:#fff;border:1px solid #e4e4e7;border-radius:12px;min-height:200px;display:flex;align-items:center;justify-content:center}
#qr-box img,#qr-box canvas{display:block}
#status{margin-top:12px;font-size:15px;font-weight:600;min-height:24px}
#status.waiting{color:#71717a}
#status.scanned{color:#2563eb}
#status.ok{color:#15803d}
#status.error{color:#b91c1c}
#status.expired{color:#b91c1c}
#status.unknown{color:#d97706}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #e4e4e7;border-top-color:var(--c);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.bind-code{font-size:42px;font-weight:900;letter-spacing:8px;color:#15803d;text-align:center;padding:16px;background:#f0fdf4;border:2px dashed #86efac;border-radius:12px;margin:12px 0}
.btn{font:inherit;padding:12px 20px;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600;width:100%;transition:all .2s}
.btn-primary{background:#18181b;color:#fff}
.btn-primary:hover{background:#27272a}
.btn-primary:disabled{background:#a1a1aa;cursor:not-allowed}
.btn-secondary{background:#f4f4f5;color:#52525b;border:1px solid #e4e4e7}
.btn-secondary:hover{background:#e4e4e7}
.hint{font-size:13px;color:#71717a;margin-top:8px;line-height:1.6}
.faq{font-size:13px;color:#71717a;margin-top:12px}
.faq summary{cursor:pointer;font-weight:600;color:#52525b}
.faq[open] summary{margin-bottom:8px}
.faq p{margin:4px 0;line-height:1.6}
.ok-badge{display:inline-block;background:#15803d;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:bold}
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:600;color:#52525b;margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1px solid #d4d4d8;border-radius:8px;font-size:14px;font-family:monospace}
.field input:focus{outline:none;border-color:#18181b;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.step{background:#f4f4f5;padding:10px 12px;border-radius:8px;margin:6px 0;font-size:13px;line-height:1.6}
.step b{color:#18181b}
.mono{font-family:monospace;background:#e4e4e7;padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>账号绑定</h1>
<p class="sub">扫码登录音乐平台, 播放 VIP 歌曲</p>

<!-- ========== 扫码登录 ========== -->
<div class="card">
  <div class="tabs">
    <div class="tab active" data-platform="qq" style="--c:#d946ef;--bg:#fdf4ff">QQ音乐</div>
    <div class="tab" data-platform="kugou" style="--c:#16a34a;--bg:#f0fdf4">酷狗</div>
    <div class="tab" data-platform="kuwo" style="--c:#ea580c;--bg:#fff7ed">酷我</div>
  </div>

  <div id="qr-area">
    <div id="qr-box"><p style="color:#a1a1aa;font-size:14px">点击下方按钮生成二维码</p></div>
    <div id="status" class="waiting"></div>
    <div id="bind-code-area" style="display:none">
      <div class="bind-code" id="bind-code"></div>
      <p class="hint" style="text-align:center">请回到游戏, 在聊天栏输入上方 6 位数字绑定码, 按回车</p>
    </div>
  </div>

  <button class="btn btn-primary" id="startBtn" onclick="startLogin()">生成二维码</button>
  <p class="hint" id="qr-hint">用 <b>QQ APP</b> (不是QQ音乐APP) 扫码登录</p>
</div>

<!-- ========== 手动输入 (备用方式) ========== -->
<details class="card faq" id="manual-card">
  <summary>手动输入 Cookie (备用方式) — 扫码不成功时用这个</summary>
  <div id="manual-area"></div>
</details>

<details class="card faq">
  <summary>常见问题</summary>
  <p><b>QQ音乐扫码显示下载页?</b> 请用 <b>QQ APP</b> 扫码, 不是QQ音乐APP。</p>
  <p><b>扫码后一直转圈?</b> 等待几秒, 如果超过30秒请重新生成二维码。</p>
  <p><b>二维码过期了?</b> 重新点"生成二维码"即可。</p>
  <p><b>绑定码过期了?</b> 5分钟内有效, 过期请重新扫码。</p>
  <p><b>提示"已绑定"?</b> 在游戏内先解绑, 再重新扫码绑定。</p>
</details>
</div>

<script>
let currentPlatform = 'qq';
let pollTimer = null;
let loginToken = null;
let pollCount = 0;

const PLATFORMS = {
  qq:    { name: 'QQ音乐', app: 'QQ APP (不是QQ音乐APP)', site: 'https://y.qq.com/' },
  kugou: { name: '酷狗',   app: '酷狗音乐 APP',           site: 'https://www.kugou.com/' },
  kuwo:  { name: '酷我',   app: '酷我音乐 APP',           site: 'https://www.kuwo.cn/' },
};

// 手动输入字段配置
const MANUAL_FIELDS = {
  qq: [
    { key: 'userId', label: 'QQ号 (uin, 纯数字)', placeholder: '如: 2445387644', required: true },
    { key: 'token', label: 'p_skey (从Cookie中找)', placeholder: '如: A1B2C3...', required: true },
  ],
  kugou: [
    { key: 'userId', label: 'KugooID', placeholder: '从Cookie中找 KugooID', required: true },
    { key: 'token', label: 'KugooToken', placeholder: '从Cookie中找 KugooToken', required: true },
  ],
  kuwo: [
    { key: 'userId', label: 'kw_user_id', placeholder: '从Cookie中找 kw_user_id', required: true },
    { key: 'token', label: 'kw_token', placeholder: '从Cookie中找 kw_token', required: true },
  ],
};

const API_BASE = new URLSearchParams(location.search).get('api') || '';

// 平台切换
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentPlatform = tab.dataset.platform;
    stopPoll();
    resetUI();
    updateManualFields();
    document.getElementById('qr-hint').innerHTML = '用 <b>' + PLATFORMS[currentPlatform].app + '</b> 扫码登录';
  });
});

function resetUI() {
  document.getElementById('qr-box').innerHTML = '<p style="color:#a1a1aa;font-size:14px">点击下方按钮生成二维码</p>';
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = 'waiting';
  document.getElementById('bind-code-area').style.display = 'none';
  document.getElementById('startBtn').textContent = '生成二维码';
  document.getElementById('startBtn').disabled = false;
  pollCount = 0;
}

// 更新手动输入字段
function updateManualFields() {
  const area = document.getElementById('manual-area');
  const fields = MANUAL_FIELDS[currentPlatform];
  const platName = PLATFORMS[currentPlatform].name;
  const site = PLATFORMS[currentPlatform].site;

  let html = '<p class="hint" style="margin-bottom:12px">如果扫码不成功, 可以手动从浏览器 Cookie 中复制需要的值填入下方:</p>';

  // 步骤说明
  html += '<div class="step"><b>步骤1:</b> 打开 <span class="mono">' + site + '</span> 并登录</div>';
  html += '<div class="step"><b>步骤2:</b> 按 <span class="mono">F12</span> → 点击 <b>Application</b> (应用) 标签</div>';
  html += '<div class="step"><b>步骤3:</b> 左侧 <b>Cookies</b> → 点击网站域名</div>';
  html += '<div class="step"><b>步骤4:</b> 找到下方字段名, 复制对应的 Value 填入下方输入框</div>';

  // 输入框
  fields.forEach(f => {
    html += '<div class="field">';
    html += '<label>' + f.label + (f.required ? ' <span style="color:#b91c1c">*</span>' : '') + '</label>';
    html += '<input type="text" id="manual-' + f.key + '" placeholder="' + f.placeholder + '" autocomplete="off">';
    html += '</div>';
  });

  html += '<button class="btn btn-primary" style="margin-top:12px" onclick="submitManual()">提交绑定</button>';
  html += '<div id="manual-result"></div>';

  area.innerHTML = html;
}

// 提交手动绑定
async function submitManual() {
  const fields = MANUAL_FIELDS[currentPlatform];
  const params = new URLSearchParams();
  params.set('platform', currentPlatform);

  for (const f of fields) {
    const val = document.getElementById('manual-' + f.key).value.trim();
    if (f.required && !val) {
      document.getElementById('manual-result').innerHTML = '<p style="color:#b91c1c;margin-top:8px">请填写: ' + f.label + '</p>';
      return;
    }
    if (val) params.set(f.key, val);
  }

  document.getElementById('manual-result').innerHTML = '<p style="color:#71717a;margin-top:8px">正在提交...</p>';

  try {
    const resp = await fetch(`${API_BASE}/api?action=manual_bind&${params.toString()}`);
    const data = await resp.json();
    if (data.ok) {
      document.getElementById('manual-result').innerHTML = `
        <div style="margin-top:12px;padding:16px;background:#f0fdf4;border:2px dashed #86efac;border-radius:12px;text-align:center">
          <p style="color:#15803d;font-weight:600;margin-bottom:8px">绑定成功!</p>
          <div class="bind-code">${data.bindCode}</div>
          <p class="hint">请回到游戏, 输入上方 6 位绑定码</p>
        </div>`;
    } else {
      document.getElementById('manual-result').innerHTML = '<p style="color:#b91c1c;margin-top:8px">' + (data.message || '提交失败') + '</p>';
    }
  } catch (err) {
    document.getElementById('manual-result').innerHTML = '<p style="color:#b91c1c;margin-top:8px">网络错误: ' + err.message + '</p>';
  }
}

// 开始扫码登录
async function startLogin() {
  const btn = document.getElementById('startBtn');
  const status = document.getElementById('status');
  const qrBox = document.getElementById('qr-box');

  btn.disabled = true;
  btn.textContent = '正在获取二维码...';
  status.className = 'waiting';
  status.innerHTML = '<span class="spinner"></span>正在获取二维码...';
  document.getElementById('bind-code-area').style.display = 'none';
  pollCount = 0;

  try {
    const resp = await fetch(`${API_BASE}/api?action=qr_create&server=${currentPlatform}`);
    const data = await resp.json();

    if (!data.ok) {
      status.className = 'error';
      status.textContent = data.message || '获取二维码失败';
      btn.disabled = false;
      btn.textContent = '重新生成二维码';
      // 自动展开手动输入
      document.getElementById('manual-card').open = true;
      return;
    }

    loginToken = data.token;
    qrBox.innerHTML = '';

    if (data.qrContent) {
      new QRCode(qrBox, {
        text: data.qrContent,
        width: 200,
        height: 200,
        colorDark: '#000000',
        colorLight: '#ffffff',
      });
    } else if (data.qrUrl) {
      qrBox.innerHTML = `<img src="${data.qrUrl}" width="200" height="200" alt="二维码">`;
    } else {
      status.className = 'error';
      status.textContent = '未获取到二维码';
      btn.disabled = false;
      btn.textContent = '重新生成二维码';
      return;
    }

    status.className = 'waiting';
    status.innerHTML = '<span class="spinner"></span>请用 ' + PLATFORMS[currentPlatform].app + ' 扫码';
    btn.textContent = '重新生成二维码';
    btn.disabled = false;

    startPoll();
  } catch (err) {
    status.className = 'error';
    status.textContent = '网络错误: ' + err.message;
    btn.disabled = false;
    btn.textContent = '重新生成二维码';
  }
}

function startPoll() {
  stopPoll();
  pollTimer = setInterval(pollStatus, 2000);
}

function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

async function pollStatus() {
  if (!loginToken) return;
  const status = document.getElementById('status');
  pollCount++;

  // 超过 60 次 (2分钟) 自动停止
  if (pollCount > 60) {
    stopPoll();
    status.className = 'expired';
    status.textContent = '等待超时, 请重新生成二维码';
    document.getElementById('startBtn').textContent = '重新生成二维码';
    document.getElementById('startBtn').disabled = false;
    return;
  }

  try {
    const resp = await fetch(`${API_BASE}/api?action=qr_check&server=${currentPlatform}&token=${loginToken}`);
    const data = await resp.json();

    if (data.status === 'waiting') {
      status.className = 'waiting';
      status.innerHTML = '<span class="spinner"></span>请用 ' + PLATFORMS[currentPlatform].app + ' 扫码';
    } else if (data.status === 'scanned') {
      status.className = 'scanned';
      status.innerHTML = '✓ 已扫码, 请在手机上点击确认登录';
    } else if (data.status === 'ok') {
      stopPoll();
      status.className = 'ok';
      status.innerHTML = '<span class="ok-badge">✓ 登录成功</span> ' + (data.nickname || '');
      if (data.bindCode) {
        document.getElementById('bind-code').textContent = data.bindCode;
        document.getElementById('bind-code-area').style.display = 'block';
        document.getElementById('startBtn').textContent = '登录成功';
        document.getElementById('startBtn').disabled = true;
      }
    } else if (data.status === 'expired') {
      stopPoll();
      status.className = 'expired';
      status.textContent = data.message || '二维码已过期, 请重新生成';
      document.getElementById('startBtn').textContent = '重新生成二维码';
      document.getElementById('startBtn').disabled = false;
    } else if (data.status === 'error') {
      stopPoll();
      status.className = 'error';
      status.textContent = data.message || '登录失败';
      document.getElementById('startBtn').textContent = '重新生成二维码';
      document.getElementById('startBtn').disabled = false;
    } else if (data.status === 'unknown') {
      // QQ扫码返回unknown时, 显示具体原因但不停止轮询
      status.className = 'unknown';
      status.innerHTML = '<span class="spinner"></span>' + (data.message || '正在等待登录结果...');
    }
  } catch (err) {
    // 网络错误不停止轮询
  }
}

// 初始化
updateManualFields();
</script>
</body>
</html>
